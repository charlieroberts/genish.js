<!doctype html>
<html lang='en'>
  <head>
    <title>Genish.js Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/wabt@1.0.37/index.min.js"></script>
    <!--<script src='https://cdn.jsdelivr.net/gh/charlieroberts/bitty/bitty.js' defer></script>-->
    <script src='../../bitty/bitty.js' defer></script>
    <script src='./bundle.js' type='module' ></script>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon"> 
<style>
body { 
  margin: 0;
  box-sizing:border;
  background:black;
  color:#ccc;
  font-family: Helvetica Neue, sans-serif;
  tab-size:2;
}

::highlight(comments){ background:none; color:grey; }
::highlight(numbers) { color:cyan; }
::highlight(keywords){ color:#f0f; }

#header { 
  width:100%; 
  height:2em; 
  background:black; 
  top:0;
  position:sticky;
  border-bottom:1px solid #aaa;
  z-index:10;
}

select{ 
  display:inline-block;
  background:black;
  color: #ccc;
  -webkit-border-radius:0px;
  -moz-border-radius:0px;
  border-radius:0px;
  border-color: #555;
}

h1 {
  font-family: monospace;
  font-size: 1.5em;
  font-weight: normal;
  padding-left:.5em;
  padding-top:.25em;
  padding-right: 3em;
  height:1.5em;
  vertical-align:middle;
  display:inline-block;
  margin:0
}

#header span { font-size: .8em; }
#reference a{ color: #ccc !important; margin-left: 2em }

/* main editor class */
.bitty-editor { 
  /* choose font and size */
  font-family:   'Roboto Mono', monospace; 
  font-size:     14px;
  /* fill viewport with editor */
  height:        calc(100% - 2em);
  /* provide scrollbars if needed */
  overflow-y:    auto;
  /* preserve whitespace */
  white-space:   pre-wrap;
  outline: none;
  padding-left:3rem;
  counter-reset: line; 
}

.bitty-editor div { 
  /* ensure all divs are block elements to prevent collapse when empty*/
  display:  block; 
  position: relative; 
}

.bitty-editor div::before {
  content:           counter(line); 
  counter-increment: line; 
  position:          absolute; 
  /* should accommodate up to 999 lines, otherwise tweak as needed */
  right:             calc(100% + .75rem); 
  opacity:           0.5; 
}

/* for when text is selected */
::selection {
  background:#444;
  color:white;
}
</style>

  </head>

  <body>

    <div id='header'>
      <h1>genish.js</h1>

      <span>demos:</span>

      <select>
        <option>intro &amp; instructions</option>
        <option>thereminish - mouse interaction</option>
        <option>a delay line</option>
        <option>slicing the amen break</option>
        <option>bit-crushing / sample-rate reduction</option>
        <option>sequencing</option>
        <option>hard/soft oscillator sync</option>
        <option>bandlimited fm synthesis</option>
        <option>enveloping</option>
        <option>freeverb</option>
        <option>karplus-strong model</option>
        <option>two-pole virtual analog filter</option>
        <option>four-pole ladder-style filter</option>
      </select>
      
      <span id='reference'><a href='../docs/index.html'>reference</a>

    </div>

    <div class='bitty-editor' contenteditable="true" spellcheck="false"></div>
  </body>

</html>
